[platformio]
default_envs = esp32-s3

[base]
platform = espressif32@~8.0.0
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17

[env:esp32-s3]
extends = base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    ${base.build_flags}
    -DBOARD_HAS_PSRAM
    -DGNSS_RX_PIN=16
    -DGNSS_TX_PIN=17
lib_deps =

[env:esp32-c3]
extends = base
board = esp32-c3-devkitm-1
build_flags =
    ${base.build_flags}
    -DGNSS_RX_PIN=4
    -DGNSS_TX_PIN=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =

[env:esp32-s3-lc29h-da]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -DGNSS_RECEIVER=GNSS_RECEIVER_LC29H_DA

[env:esp32-c3-lc29h-da]
extends = env:esp32-c3
build_flags =
    ${env:esp32-c3.build_flags}
    -DGNSS_RECEIVER=GNSS_RECEIVER_LC29H_DA
