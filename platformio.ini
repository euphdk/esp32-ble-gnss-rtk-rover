[platformio]
default_envs = esp32-s3

[base]
platform = espressif32@~8.0.0
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17

[env:esp32-s3]
extends = base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
build_flags =
    ${base.build_flags}
    -DBOARD_HAS_PSRAM
    -DGNSS_RX_PIN=16
    -DGNSS_TX_PIN=17
lib_deps =

[env:esp32-c3]
extends = base
board = esp32-c3-devkitm-1
build_flags =
    ${base.build_flags}
    -DGNSS_RX_PIN=4
    -DGNSS_TX_PIN=5
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =

[env:esp32-s3-lc29h-da]
extends = env:esp32-s3
build_flags =
    ${env:esp32-s3.build_flags}
    -DGNSS_RECEIVER=GNSS_RECEIVER_LC29H_DA

[env:esp32-c3-lc29h-da]
extends = env:esp32-c3
upload_port = /dev/tty.usbmodem12301
monitor_port = /dev/tty.usbmodem12301
build_flags =
    ${env:esp32-c3.build_flags}
    -DGNSS_RECEIVER=GNSS_RECEIVER_LC29H_DA

[oled]
lib_deps =
    adafruit/Adafruit SSD1306@2.5.15
    adafruit/Adafruit GFX Library@1.12.6
build_flags =
    -DENABLE_OLED

[env:esp32-s3-oled]
extends = env:esp32-s3
lib_deps = ${oled.lib_deps}
build_flags =
    ${env:esp32-s3.build_flags}
    ${oled.build_flags}
    -DOLED_SDA_PIN=8
    -DOLED_SCL_PIN=9

[env:esp32-c3-oled]
extends = env:esp32-c3
lib_deps = ${oled.lib_deps}
build_flags =
    ${env:esp32-c3.build_flags}
    ${oled.build_flags}
    -DOLED_SDA_PIN=6
    -DOLED_SCL_PIN=7

[env:esp32-s3-lc29h-da-oled]
extends = env:esp32-s3-oled
build_flags =
    ${env:esp32-s3-oled.build_flags}
    -DGNSS_RECEIVER=GNSS_RECEIVER_LC29H_DA

[env:esp32-c3-lc29h-da-oled]
extends = env:esp32-c3-oled
upload_port = ${env:esp32-c3-lc29h-da.upload_port}
monitor_port = ${env:esp32-c3-lc29h-da.monitor_port}
build_flags =
    ${env:esp32-c3-oled.build_flags}
    -DGNSS_RECEIVER=GNSS_RECEIVER_LC29H_DA
